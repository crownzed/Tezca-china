databases:
  - name: tiengtrung-db
    plan: free
    databaseName: tiengtrung
    postgresMajorVersion: "16"

services:
  - type: web
    name: tiengtrung-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # Postgres connection string, auto-wired from the database above.
      # Render emits a postgresql:// URL; db.py rewrites it to the psycopg3 driver.
      - key: DATABASE_URL
        fromDatabase:
          name: tiengtrung-db
          property: connectionString
      # Strong secret generated and persisted by Render on first deploy.
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://tezca-china.vercel.app,https://poseidonz227.id.vn,https://www.poseidonz227.id.vn,https://tiengtrung-49e13.web.app,https://tiengtrung-49e13.firebaseapp.com
      # LLM provider keys for AI quiz generation (/api/custom-vocab/*).
      # Secrets — set the real values in the Render dashboard, never in git.
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      # Native Google AI Studio keys — required by the speech features
      # (pronunciation scoring + voice chat) which send audio to the native
      # Gemini API. Without this, /api/speech/* raises and the UI shows
      # "Failed to fetch". Comma-separated.
      - key: GEMINI_NATIVE_API_KEYS
        sync: false
