# fly.toml app configuration file generated for tezca-china on 2026-07-16T16:06:43Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "tezca-china"
primary_region = "sin"  # Singapore — gần VN nhất

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = false
  auto_stop_machines = 'stop'
  auto_start_machines = false
  min_machines_running = 0
  checks = [{ grace_period = '20s', interval = '30s', method = 'GET', path = '/health', timeout = '5s' }]

  [[http_service.checks]]
    path = "/health"
    method = "GET"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
