# Keep-alive — pings the Render backend every ~10 minutes so the free-tier
# instance never idles into a cold start (Render sleeps after 15 min of no
# traffic; the first request afterwards blocks ~30s while it wakes up).
name: Keep Backend Awake

on:
  schedule:
    # Every 10 minutes, offset off :00 to avoid the top-of-hour scheduler surge.
    # Well under Render's 15-minute idle threshold.
    - cron: '5,15,25,35,45,55 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
              https://tiengtrung-api.onrender.com/health || echo 000)
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "health check did not return 200 after 3 attempts"
          exit 1
