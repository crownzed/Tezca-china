# Fly.io app config cho backend FastAPI (Tezca China).
# Deploy từ thư mục backend/ (nơi có Dockerfile). DB dùng Turso (libSQL) remote,
# nên KHÔNG cần volume/disk. Secrets (DATABASE_URL, TURSO_AUTH_TOKEN, các API key)
# set qua `fly secrets set`, không ghi trong file này.

app = "tezca-china"
primary_region = "sin"  # Singapore — gần VN nhất

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"    # dừng máy thừa khi vắng traffic
  auto_start_machines = true     # tự dậy khi có request
  min_machines_running = 1       # giữ 1 máy luôn chạy → tránh cold-start mỗi lần

  [[http_service.checks]]
    path = "/health"
    method = "GET"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"   # parselmouth + numpy cần bộ nhớ; nâng lên 1gb nếu OOM
