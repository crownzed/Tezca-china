name: Content QA

on:
  push:
    branches: [main]
    paths:
      - 'backend/app/data/conversation_scenarios.json'
      - 'backend/app/data/exam_passages.json'
      - 'backend/app/services/conversation_bank_service.py'
      - 'backend/app/services/exam_passage_service.py'
      - 'backend/tests/test_conversation_bank.py'
      - 'backend/tests/test_exam_passages.py'
      - 'scripts/validate-conversation-bank.mjs'
      - 'scripts/validate-exam-passages.mjs'
      - '.github/workflows/content-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/data/conversation_scenarios.json'
      - 'backend/app/data/exam_passages.json'
      - 'backend/app/services/conversation_bank_service.py'
      - 'backend/app/services/exam_passage_service.py'
      - 'backend/tests/test_conversation_bank.py'
      - 'backend/tests/test_exam_passages.py'
      - 'scripts/validate-conversation-bank.mjs'
      - 'scripts/validate-exam-passages.mjs'
      - '.github/workflows/content-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate content banks
        run: |
          node scripts/validate-conversation-bank.mjs
          node scripts/validate-exam-passages.mjs

      - name: Test content-bank services
        working-directory: backend
        run: python -m unittest tests.test_conversation_bank tests.test_exam_passages -q
