services:
  - type: web
    name: tiengtrung-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: CORS_ORIGINS
        value: https://tiengtrung-49e13.web.app,https://tiengtrung-49e13.firebaseapp.com
